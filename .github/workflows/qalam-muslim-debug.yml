name: Qalam Muslim Release and Android Launch Test

on:
  push:
    branches:
      - qalam-muslim-development
  workflow_dispatch:

concurrency:
  group: qalam-muslim-final-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Build optimized ARM64 release
        run: |
          flutter build apk --flavor fdroid --release --target-platform android-arm64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-fdroid-release.apk dist/qalam-muslim-arm64-release.apk

      - name: Verify ARM64 APK metadata and launcher icon
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging dist/qalam-muslim-arm64-release.apk | tee dist/apk-badging.txt
          grep -q "package: name='com.ahmed.qalammuslim'" dist/apk-badging.txt
          grep -q "application-icon" dist/apk-badging.txt
          test -s dist/qalam-muslim-arm64-release.apk

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v6
        with:
          name: qalam-muslim-arm64-release
          path: |
            dist/qalam-muslim-arm64-release.apk
            dist/apk-badging.txt
          if-no-files-found: error
          retention-days: 14

      - name: Build x86_64 release for emulator
        run: |
          flutter build apk --flavor fdroid --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-fdroid-release.apk dist/qalam-muslim-x86_64-release.apk

      - name: Install and launch on Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save
          script: |
            set -eu
            mkdir -p dist
            adb wait-for-device
            adb install -r dist/qalam-muslim-x86_64-release.apk
            adb shell am force-stop com.ahmed.qalammuslim
            adb shell am start -n com.ahmed.qalammuslim/com.quran.aya.MainActivity > dist/launch-result.txt 2>&1 || true
            sleep 10
            PID=""
            for attempt in $(seq 1 15); do
              PID="$(adb shell pidof com.ahmed.qalammuslim 2>/dev/null | tr -d '\\r' || true)"
              if [ -n "$PID" ]; then
                break
              fi
              sleep 2
            done
            if [ -z "$PID" ]; then
              adb shell dumpsys activity activities > dist/activities-after-launch.txt || true
              adb logcat -d -v time -t 5000 > dist/android-launch-log.txt || true
              echo "Qalam Muslim process did not stay alive after launch."
              exit 1
            fi
            echo "$PID" | tee dist/process-id.txt
            sleep 15
            adb shell dumpsys activity activities > dist/activities-after-launch.txt
            adb exec-out screencap -p > dist/launch-screen.png
            adb logcat -d -v time -t 5000 > dist/android-launch-log.txt
            if ! grep -q "com.quran.aya.MainActivity" dist/activities-after-launch.txt; then
              echo "Qalam Muslim MainActivity is not visible in the activity stack."
              exit 1
            fi
            if grep -E "FATAL EXCEPTION|Process: com.ahmed.qalammuslim" dist/android-launch-log.txt; then
              echo "A fatal application exception was recorded."
              exit 1
            fi
            echo "PASS: application installed, launched, and remained alive on Android 11."

      - name: Upload Android launch diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qalam-muslim-android-launch-diagnostics
          path: |
            dist/launch-result.txt
            dist/process-id.txt
            dist/activities-after-launch.txt
            dist/launch-screen.png
            dist/android-launch-log.txt
          if-no-files-found: ignore
          retention-days: 14
