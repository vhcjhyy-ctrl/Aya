name: Qalam Muslim Optimized Release APK

on:
  push:
    branches:
      - qalam-muslim-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Build optimized Android release APKs
        run: flutter build apk --flavor fdroid --release --split-per-abi

      - name: Upload APK files
        uses: actions/upload-artifact@v6
        with:
          name: qalam-muslim-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
