name: Qalam Muslim Release and Android Launch Test

on:
  push:
    branches:
      - qalam-muslim-development
      - qalam-muslim-enhancements
      - qalam-muslim-complete-expansion
  workflow_dispatch:

concurrency:
  group: qalam-muslim-final-verification-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Includes the Android release AOT packaging fix shipped in Flutter 3.44.5.
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Start verified SQLite native-asset proxy
        run: |
          nohup python3 .github/scripts/sqlite_asset_proxy.py --port 8765 > /tmp/qalam-sqlite-proxy.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8765/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:8765/health
          cat >> pubspec.yaml <<'SQLITE_HOOKS'
          
          hooks:
            user_defines:
              sqlite3:
                source: sqlite3
                url_pattern: "http://127.0.0.1:8765/$RELEASE_TAG/$FILENAME"
          SQLITE_HOOKS
          flutter pub get

      - name: Configure persistent Android release signing
        env:
          QALAM_RELEASE_KEYSTORE_BASE64: ${{ secrets.QALAM_RELEASE_KEYSTORE_BASE64 }}
          QALAM_RELEASE_STORE_PASSWORD: ${{ secrets.QALAM_RELEASE_STORE_PASSWORD }}
          QALAM_RELEASE_KEY_ALIAS: ${{ secrets.QALAM_RELEASE_KEY_ALIAS }}
          QALAM_RELEASE_KEY_PASSWORD: ${{ secrets.QALAM_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$QALAM_RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$QALAM_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/qalam-release.jks
            cat > android/key.properties <<EOF
          storeFile=qalam-release.jks
          storePassword=$QALAM_RELEASE_STORE_PASSWORD
          keyAlias=$QALAM_RELEASE_KEY_ALIAS
          keyPassword=$QALAM_RELEASE_KEY_PASSWORD
          EOF
            chmod 600 android/key.properties android/qalam-release.jks
            echo "Persistent Android signing key configured."
          else
            echo "::warning::No persistent Qalam Muslim release key is configured. This build will use the runner's debug key and is not guaranteed to update an existing installation."
          fi

      - name: Analyze Dart source
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build optimized ARM64 release
        run: |
          flutter build apk --flavor fdroid --release --target-platform android-arm64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-fdroid-release.apk dist/qalam-muslim-arm64-release.apk

      - name: Verify ARM64 APK metadata and native libraries
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging dist/qalam-muslim-arm64-release.apk | tee dist/apk-badging.txt
          grep -q "package: name='com.ahmed.qalammuslim'" dist/apk-badging.txt
          grep -q "versionCode='10601' versionName='1.6.1'" dist/apk-badging.txt
          grep -q "application-icon" dist/apk-badging.txt
          test -s dist/qalam-muslim-arm64-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs dist/qalam-muslim-arm64-release.apk | tee dist/apk-signing.txt
          EXPECTED_SIGNER_SHA256="6a2edc757ae928665a0f27515b0329feb7ec4e5c7032020c17235de9bbe1ef42"
          ACTUAL_SIGNER_SHA256="$(grep -i 'Signer #1 certificate SHA-256 digest:' dist/apk-signing.txt | awk '{print $NF}' | tr -d ':')"
          if [ "$ACTUAL_SIGNER_SHA256" = "$EXPECTED_SIGNER_SHA256" ]; then
            echo "compatible=true" | tee dist/signing-compatibility.txt
            echo "The new APK matches the certificate of the previously delivered 1.6.0 APK."
          else
            echo "compatible=false" | tee dist/signing-compatibility.txt
            echo "expected=$EXPECTED_SIGNER_SHA256" >> dist/signing-compatibility.txt
            echo "actual=$ACTUAL_SIGNER_SHA256" >> dist/signing-compatibility.txt
            echo "::warning::The APK signer differs from the previous 1.6.0 APK. Do not install this package as an update over the existing app."
          fi
          unzip -l dist/qalam-muslim-arm64-release.apk | tee dist/arm64-apk-contents.txt
          grep -Eq 'lib/arm64-v8a/libapp\.so$' dist/arm64-apk-contents.txt
          grep -Eq 'lib/arm64-v8a/libflutter\.so$' dist/arm64-apk-contents.txt
          grep -Eq 'lib/arm64-v8a/libllama_jni\.so$' dist/arm64-apk-contents.txt
          grep -Eq 'lib/arm64-v8a/libllama\.so$' dist/arm64-apk-contents.txt
          grep -Eq 'lib/arm64-v8a/libsherpa-onnx-c-api\.so$' dist/arm64-apk-contents.txt

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v6
        with:
          name: qalam-muslim-arm64-release
          path: |
            dist/qalam-muslim-arm64-release.apk
            dist/apk-badging.txt
            dist/apk-signing.txt
            dist/signing-compatibility.txt
            dist/arm64-apk-contents.txt
          if-no-files-found: error
          retention-days: 14

      - name: Build x86_64 release for emulator
        run: |
          # Do not reuse Flutter outputs from the ARM64 build.
          flutter clean
          flutter pub get
          flutter build apk --flavor fdroid --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-fdroid-release.apk dist/qalam-muslim-x86_64-release.apk

      - name: Verify x86_64 Flutter AOT libraries
        run: |
          unzip -l dist/qalam-muslim-x86_64-release.apk | tee dist/x86_64-apk-contents.txt
          grep -Eq 'lib/x86_64/libapp\.so$' dist/x86_64-apk-contents.txt
          grep -Eq 'lib/x86_64/libflutter\.so$' dist/x86_64-apk-contents.txt
          grep -Eq 'lib/x86_64/libsherpa-onnx-c-api\.so$' dist/x86_64-apk-contents.txt

      - name: Install and launch on Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -memory 4096
          script: |
            bash .github/scripts/verify_android_launch.sh

      - name: Upload Android launch diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qalam-muslim-android-launch-diagnostics
          path: |
            dist/launch-result.txt
            dist/process-id.txt
            dist/activities-after-launch.txt
            dist/window-after-launch.txt
            dist/app-window-after-launch.txt
            dist/launch-result.txt
            dist/launch-screen.png
            dist/android-launch-log.txt
          if-no-files-found: ignore
          retention-days: 14
